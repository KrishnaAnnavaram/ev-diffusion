[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-diffusion"
version = "0.1.0"
description = "Forecast EV adoption with Bass diffusion plus owner-review sentiment"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
transformer = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=8"]

[project.scripts]
ev-diffusion = "ev_diffusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
